    <script>
      (function() {
        // Ensure window.fetch has both getter and setter so browser extensions don't crash
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {}

        // Catch and suppress uncaught errors from external browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
